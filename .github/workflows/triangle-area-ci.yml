
name: Triangle Area CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and Run JUnit Tests
        run: mvn clean verify

      - name: Upload Java JAR
        uses: actions/upload-artifact@v4
        with:
          name: triangle-area-jar
          path: target/triangle-area-ci-1.0.0.jar

  docker-image:
    docker-image:
    name: Docker Image
    runs-on: ubuntu-latest
  if: always()

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Java JAR
        uses: actions/download-artifact@v4
        with:
          name: triangle-area-jar
          path: target/

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/triangle-area-ci:latest
